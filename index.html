<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engineering — Bar & Pie</title>
  <link rel="stylesheet" href="style.css" />
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>Engineering — Bar & Pie</h1>
    <div class="actions">
      <label class="btn">
        <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
        Upload Excel
      </label>
      <button id="loadDefault" class="btn ghost">Load /data/Project&nbsp;Tracking.xlsx</button>
      <span id="fileName" class="muted"></span>
    </div>
  </header>

  <main class="wrap">
    <div class="charts">
      <div class="card">
        <h2>Total by Group (Bar)</h2>
        <canvas id="barChart"></canvas>
      </div>
      <div class="card">
        <h2>Status Distribution (Pie)</h2>
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </main>

  <footer class="foot">Just bar + pie. Overdue counted only when Project ID present, not completed, and Due &lt; today.</footer>
  <script src="app.js"></script>
</body>
</html>
